name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  trophy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trophy SVG
        run: |
          mkdir -p dist
          curl -s "https://github-profile-trophy.vercel.app/?username=Jacky-gif310&theme=algolia&column=4" -o dist/github-trophy.svg

      - name: Commit trophy image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/github-trophy.svg
          git commit -m "Update trophies" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
